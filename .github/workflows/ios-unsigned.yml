name: ios-unsigned

on:
  workflow_dispatch:
  push:
    branches: [ ios-unsigned ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: |
          corepack enable
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install


      - name: Patch iOS 26 SDK incompatibilities
        run: python3 ci/patch-ios26.py

      - name: Setup Ruby (3.2, matches 2024-era project)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Ruby gems (CocoaPods)
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Show available Xcode versions
        run: ls -d /Applications/Xcode*.app || true

      - name: Pod install
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: |
          bundle exec pod install

      - name: Build JS bundle (Metro/Hermes)
        env:
          ENVIRONMENT: release
        run: |
          npx react-native bundle --platform ios --dev false --entry-file index.js \
            --bundle-output ios/main.jsbundle --assets-dest "$RUNNER_TEMP/jsbundle-assets"
          ls -lh ios/main.jsbundle

      - name: Archive (no code signing)
        working-directory: ios
        env:
          ENVIRONMENT: release
        run: |
          set -o pipefail
          xcodebuild \
            -workspace tooot.xcworkspace \
            -scheme tooot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tooot.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP"/tooot.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/Payload/"
          cp ios/main.jsbundle "$RUNNER_TEMP/Payload/toot.app/main.jsbundle" 2>/dev/null || cp ../ios/main.jsbundle "$RUNNER_TEMP/Payload/toot.app/main.jsbundle"
          if [ -d "$RUNNER_TEMP/jsbundle-assets" ]; then cp -R "$RUNNER_TEMP"/jsbundle-assets/* "$RUNNER_TEMP/Payload/toot.app/" 2>/dev/null || true; fi
          cd "$RUNNER_TEMP"
          zip -qry tooot-unsigned.ipa Payload
          unzip -l tooot-unsigned.ipa | grep -i jsbundle
          ls -lh tooot-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: tooot-unsigned-ipa
          path: ${{ runner.temp }}/tooot-unsigned.ipa
          if-no-files-found: error
